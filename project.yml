name: ImageGen
options:
  bundleIdPrefix: com.andrewpurtell
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated   # D§5: keep @Model/@ModelActor compatible
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  ImageGen:
    type: application
    platform: iOS
    sources:
      - path: ImageGen
        excludes: ["Info.plist"]
      - path: Platforms/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IMAGEGEN_BUNDLE_ID)
        PRODUCT_NAME: ImageGen
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: ImageGen/Info.plist
      properties:
        CFBundleDisplayName: ImageGen
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: "ImageGen saves the images you choose to your photo library."
        ITSAppUsesNonExemptEncryption: false
        # No UIBackgroundModes and no BGTaskSchedulerPermittedIdentifiers in v1 (D§10).
  ImageGenMac:
    type: application
    platform: macOS
    sources:
      - path: ImageGen
        excludes: ["Info.plist"]
      - path: Platforms/macOS
        excludes: ["Info.plist", "ImageGenMac.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IMAGEGEN_BUNDLE_ID)
        PRODUCT_NAME: ImageGen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Debug runs seed and reset their store, so they get their own sandbox container, defaults and keychain item.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(IMAGEGEN_BUNDLE_ID).debug
        # A Release build must not be debuggable; development signing would otherwise add get-task-allow.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    entitlements:
      path: Platforms/macOS/ImageGenMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.photos-library: true
        com.apple.application-identifier: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: Platforms/macOS/Info.plist
      properties:
        CFBundleDisplayName: ImageGen
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.graphics-design
        NSPhotoLibraryAddUsageDescription: "ImageGen saves the images you choose to your photo library."
        NSPhotoLibraryUsageDescription: "ImageGen saves the images you choose to your photo library."
        ITSAppUsesNonExemptEncryption: false
  ImageGenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ImageGenTests
        excludes: ["Fixtures/**"]
      - path: ImageGenTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ImageGen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IMAGEGEN_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  ImageGenMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ImageGenTests
        excludes: ["Fixtures/**"]
      - path: ImageGenTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ImageGenMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IMAGEGEN_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ImageGen.app/Contents/MacOS/ImageGen
schemes:
  ImageGenMac:
    build:
      targets:
        ImageGenMac: all
        ImageGenMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImageGenMacTests
    archive:
      config: Release
  ImageGen:
    build:
      targets:
        ImageGen: all
        ImageGenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ImageGenTests
    archive:
      config: Release
